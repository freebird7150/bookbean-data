name: 또래 인기 도서 갱신

on:
  schedule:
    - cron: "17 19 * * *"   # 매일 한국 시간 새벽 4시 17분 (UTC 19:17)
  workflow_dispatch:         # Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 정보나루에서 받기
        env:
          LIBRARY_KEY: ${{ secrets.LIBRARY_KEY }}
        run: python -u scripts/fetch_popular.py

      - name: 바뀐 게 있으면 올리기
        run: |
          git config user.name "bookbean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popular
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "또래 인기 도서 갱신 $(date -u +%F)"
            git push
          fi
